name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py test
        env:
          DJANGO_DB_ENGINE: sqlite
          DJANGO_SECRET_KEY: ci

  build:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/income-share-api:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/income-share-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/income-share-web:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/income-share-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Trigger Jenkins deploy
        env:
          JENKINS_DEPLOY_URL: ${{ secrets.JENKINS_DEPLOY_URL }}
          JENKINS_USER: ${{ secrets.JENKINS_USER }}
          JENKINS_TOKEN: ${{ secrets.JENKINS_TOKEN }}
        run: |
          set -eu
          if [ -z "${JENKINS_USER:-}" ] || [ -z "${JENKINS_TOKEN:-}" ]; then
            echo "JENKINS_USER and JENKINS_TOKEN secrets are required (Jenkins user API token, not the job token)."
            exit 1
          fi
          if [ -z "${JENKINS_DEPLOY_URL:-}" ]; then
            echo "JENKINS_DEPLOY_URL secret is required."
            exit 1
          fi
          base="${JENKINS_DEPLOY_URL%%/job/*}"
          crumb_json=$(curl -fsS -u "$JENKINS_USER:$JENKINS_TOKEN" "$base/crumbIssuer/api/json")
          field=$(echo "$crumb_json" | jq -r '.crumbRequestField')
          crumb=$(echo "$crumb_json" | jq -r '.crumb')
          curl -fsS -X POST -u "$JENKINS_USER:$JENKINS_TOKEN" \
            -H "$field: $crumb" \
            --data-urlencode "IMAGE_TAG=${GITHUB_SHA}" \
            "$JENKINS_DEPLOY_URL"
